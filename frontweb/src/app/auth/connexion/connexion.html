<app-landing-header />

<main class="auth-shell">
  <div class="auth-card">
    <header class="auth-card__head">
      <span class="auth-card__icon"><app-icon name="user" /></span>
      <h1 class="auth-card__title">Connexion</h1>
      <p class="auth-card__subtitle">
        Accédez à votre espace candidat pour postuler aux offres de stage de la STEG.
      </p>
    </header>

    @if (error(); as message) {
      <div class="auth-alert auth-alert--error" role="alert">{{ message }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="field__label" for="email">Adresse email</label>
        <input
          class="field__input"
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
          placeholder="vous@exemple.tn"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </div>

      <div class="field">
        <label class="field__label" for="password">Mot de passe</label>
        <input
          class="field__input"
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
      </div>

      <button class="btn btn--primary btn--block" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <app-icon name="loader" />
          Connexion…
        } @else {
          Se connecter
        }
      </button>
    </form>

    <div class="auth-switch">
      <a routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a>
    </div>
    <div class="auth-switch">
      Pas encore de compte ?
      <a routerLink="/inscription">Créer un compte</a>
    </div>
  </div>
</main>

<app-landing-footer />
